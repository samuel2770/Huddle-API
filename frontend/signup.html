<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Huddle</title>
  <meta name="description" content="Set up Huddle for your team. Real-time team collaboration, channels, messaging and presence tracking.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
</head>
<body>

  <div class="page-wrapper">
    <!-- Left Column: Form Section -->
    <div class="auth-left-pane">
      <!-- Top Brand Header -->
      <header class="auth-header">
        <a href="index.html" class="brand-logo" aria-label="Huddle Home">
          huddle<span class="dot">•</span>
        </a>
        <div class="locale-indicator" role="button" tabindex="0" title="Language selection">
          ENG US
        </div>
      </header>

      <!-- Main Form Area -->
      <main class="auth-content">
        <h1 class="auth-heading">Hi there!</h1>
        <p class="auth-subheading">Set up Huddle for your team.</p>

        <form id="signupForm" class="auth-form" novalidate>
          <!-- Name Field -->
          <div class="form-group">
            <label for="name" class="form-label">
              Name <span class="asterisk">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </span>
              <input 
                type="text" 
                id="name" 
                name="fullName" 
                class="form-input" 
                placeholder="Grace Abdul" 
                required 
                autofocus 
                autocomplete="name"
              >
            </div>
          </div>

          <!-- Email Field -->
          <div class="form-group">
            <label for="email" class="form-label">
              Email <span class="asterisk">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
              </span>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="grace@teamname.com" 
                required 
                autocomplete="email"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password" class="form-label">
              Password <span class="asterisk">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="••••••••••••" 
                required 
                autocomplete="new-password"
              >
              <button 
                type="button" 
                class="input-icon-right" 
                data-toggle="password" 
                data-target="password" 
                aria-label="Toggle password visibility"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>

            <!-- Password Requirements Dropdown Chips -->
            <div class="password-requirements" id="passwordRequirements" aria-live="polite">
              <div class="requirements-chips">
                <span class="req-chip unmet" data-req="lower">
                  <span class="req-icon">✕</span> 1 lowercase letter
                </span>
                <span class="req-chip unmet" data-req="number">
                  <span class="req-icon">✕</span> 1 number
                </span>
                <span class="req-chip unmet" data-req="upper">
                  <span class="req-icon">✕</span> 1 uppercase letter
                </span>
                <span class="req-chip unmet" data-req="special">
                  <span class="req-icon">✕</span> 1 special character
                </span>
                <span class="req-chip unmet" data-req="length">
                  <span class="req-icon">✕</span> At least 8 characters
                </span>
              </div>
            </div>
          </div>

          <!-- Submit Button (Centered Spinner on Loading matching screenshot) -->
          <div class="form-actions">
            <button type="submit" class="submit-btn" disabled id="continueBtn">
              <span class="btn-spinner" aria-label="Loading..."></span>
              <span class="btn-text">Continue</span>
            </button>
          </div>

          <!-- Already have an account link (Positioned directly under button) -->
          <p class="auth-switch-text">
            Already have an account? <a href="signin.html">Sign in</a>
          </p>
        </form>
      </main>

      <!-- Desktop Footer -->
      <footer class="auth-footer">
        2026. Huddle by Altschool Africa
      </footer>
    </div>

    <!-- Right Column: Hero Image Card (Desktop Only) -->
    <aside class="auth-right-pane" aria-label="Team preview">
      <div class="hero-image-card">
        <img 
          src="images/side-image.jpg" 
          alt="Two team members collaborating happily on a laptop in an office lounge"
          loading="eager"
        >
      </div>
    </aside>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
