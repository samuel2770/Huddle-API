<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huddle</title>
  <meta name="description" content="Huddle — Real-time team collaboration.">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #111827;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-screen stage */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
    }

    /* Logo row */
    .logo-stage {
      position: relative;
      display: inline-flex;
      align-items: baseline;
    }

    /* Each letter */
    .letter {
      font-size: clamp(52px, 8vw, 90px);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -2px;
      line-height: 1;
      opacity: 0;
      transform: translateY(20px);
      display: inline-block;
      will-change: opacity, transform;
      transition: none;
    }

    /* The rolling dot */
    .dot-ball {
      position: fixed;
      width: clamp(10px, 1.5vw, 16px);
      height: clamp(10px, 1.5vw, 16px);
      border-radius: 50%;
      background: #FF7700;
      box-shadow:
        0 0 20px 5px rgba(255,119,0,0.6),
        0 0 56px 18px rgba(255,119,0,0.2);
      will-change: left, top;
      z-index: 20;
      transition: none;
    }

    /* Exit fade overlay */
    #exit-overlay {
      position: fixed;
      inset: 0;
      background: #111827;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.65s ease;
    }
    #exit-overlay.active { opacity: 1; }

    /* Ambient floating particles */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,119,0,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: rise linear infinite;
    }
    @keyframes rise {
      from { transform: translateY(0) scale(1);   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      to   { transform: translateY(-110vh) scale(1.3); opacity: 0; }
    }

    /* Dot glow pulse */
    @keyframes pulse {
      0%,100% {
        box-shadow: 0 0 20px 5px rgba(255,119,0,0.6), 0 0 56px 18px rgba(255,119,0,0.2);
      }
      50% {
        box-shadow: 0 0 32px 10px rgba(255,119,0,0.85), 0 0 80px 30px rgba(255,119,0,0.35);
      }
    }
  </style>
</head>
<body>

<div id="splash">
  <div class="logo-stage" id="logoStage"></div>
</div>

<div class="dot-ball" id="dotBall"></div>
<div id="exit-overlay"></div>

<script>
(function () {
  const WORD      = 'huddle';
  const REDIRECT  = 'index.html';

  const stage   = document.getElementById('logoStage');
  const dot     = document.getElementById('dotBall');
  const overlay = document.getElementById('exit-overlay');

  /* ── Build letters ── */
  const letterEls = [];
  for (const ch of WORD) {
    const s = document.createElement('span');
    s.className = 'letter';
    s.textContent = ch;
    stage.appendChild(s);
    letterEls.push(s);
  }

  /* ── Ambient particles ── */
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const sz = Math.random() * 160 + 60;
    p.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}vw;
      bottom:-${sz}px;
      animation-duration:${Math.random()*14+8}s;
      animation-delay:${Math.random()*8}s;
    `;
    document.body.appendChild(p);
  }

  /* ── Helpers ── */
  function placeDot(x, y) {
    dot.style.left = x + 'px';
    dot.style.top  = y + 'px';
  }

  function animateDot(toX, toY, durationMs, easingFn) {
    return new Promise(resolve => {
      const startX = parseFloat(dot.style.left)  || window.innerWidth  / 2;
      const startY = parseFloat(dot.style.top)   || window.innerHeight / 2;
      const start  = performance.now();

      function step(now) {
        const elapsed = now - start;
        const t = Math.min(elapsed / durationMs, 1);
        const e = easingFn ? easingFn(t) : easeInOut(t);
        dot.style.left = startX + (toX - startX) * e + 'px';
        dot.style.top  = startY + (toY - startY) * e + 'px';
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  function easeInOut(t) {
    return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
  }
  function easeOut(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function revealLetter(el, durationMs) {
    return new Promise(resolve => {
      el.style.transition = `opacity ${durationMs}ms cubic-bezier(.22,.61,.36,1),
                              transform ${durationMs}ms cubic-bezier(.22,.61,.36,1)`;
      el.style.opacity   = '1';
      el.style.transform = 'translateY(0)';
      setTimeout(resolve, durationMs);
    });
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ── Get centre of an element ── */
  function centre(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* ── Main animation sequence ── */
  async function run() {
    const dotSz = dot.offsetWidth;

    // Phase 1 – dot pulses in the centre of the screen
    placeDot(window.innerWidth / 2 - dotSz / 2, window.innerHeight / 2 - dotSz / 2);
    dot.style.animation = 'pulse 700ms ease-in-out infinite';
    await sleep(900);

    // Phase 2 – dot rolls to the left edge (before 'h')
    dot.style.animation = 'none';
    const firstC = centre(letterEls[0]);
    await animateDot(
      firstC.x - dotSz / 2,
      firstC.y - dotSz / 2,
      320,
      easeInOut
    );

    // Phase 3 – roll across each letter, revealing it
    for (let i = 0; i < letterEls.length; i++) {
      const el  = letterEls[i];
      const c   = centre(el);

      // Reveal this letter
      revealLetter(el, 260);
      await sleep(60);

      // Roll dot to next letter centre
      if (i < letterEls.length - 1) {
        const nextC = centre(letterEls[i + 1]);
        await animateDot(
          nextC.x - dotSz / 2,
          nextC.y - dotSz / 2,
          110,
          easeOut
        );
      }
    }

    // Phase 4 – dot lands in its final logo position (slightly below baseline of last 'd')
    const lastLetterRect = letterEls[4].getBoundingClientRect(); // 'd' (index 4)
    const dotFinalX = lastLetterRect.right - dotSz * 0.3;
    const dotFinalY = lastLetterRect.bottom - dotSz * 0.4;
    await animateDot(dotFinalX, dotFinalY, 220, easeOut);

    // Dot glows
    dot.style.animation = 'pulse 900ms ease-in-out infinite';
    await sleep(800);

    // Phase 5 – fade out & redirect
    overlay.classList.add('active');
    await sleep(700);
    window.location.href = REDIRECT;
  }

  // Wait for fonts/layout
  document.fonts.ready.then(run);
})();
</script>
</body>
</html>
