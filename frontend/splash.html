<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huddle</title>
  <meta name="description" content="Huddle — Real-time team collaboration.">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- v2: CSS-only animation, no font-ready dependency -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #111827;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-screen stage */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
    }

    /* Logo word container */
    .logo-word {
      position: relative;
      display: inline-flex;
      align-items: baseline;
    }

    /* Each letter - animated purely with CSS */
    .letter {
      font-size: clamp(56px, 9vw, 96px);
      font-weight: 800;
      color: #fff;
      letter-spacing: -3px;
      line-height: 1;
      display: inline-block;
      opacity: 0;
      transform: translateY(22px);
      will-change: opacity, transform;
    }
    /* Staggered drop-in: delay starts at 0.95s (while dot pulses) */
    .letter:nth-child(1){animation:dropIn .32s cubic-bezier(.22,.61,.36,1) .95s forwards;}
    .letter:nth-child(2){animation:dropIn .32s cubic-bezier(.22,.61,.36,1) 1.20s forwards;}
    .letter:nth-child(3){animation:dropIn .32s cubic-bezier(.22,.61,.36,1) 1.45s forwards;}
    .letter:nth-child(4){animation:dropIn .32s cubic-bezier(.22,.61,.36,1) 1.70s forwards;}
    .letter:nth-child(5){animation:dropIn .32s cubic-bezier(.22,.61,.36,1) 1.95s forwards;}
    .letter:nth-child(6){animation:dropIn .32s cubic-bezier(.22,.61,.36,1) 2.20s forwards;}
    @keyframes dropIn { to { opacity:1; transform:translateY(0); } }

    /* The rolling dot - absolute inside logo-word */
    .dot {
      width: clamp(10px, 1.4vw, 15px);
      height: clamp(10px, 1.4vw, 15px);
      border-radius: 50%;
      background: #FF7700;
      display: inline-block;
      position: absolute;
      left: 0;
      bottom: clamp(4px, 0.6vw, 7px);
      /* Phase 1: glow pulse 3 times; Phase 2: roll across the word */
      animation:
        dotGlow 0.6s ease-in-out 0.1s 3 alternate,
        dotRoll 1.5s cubic-bezier(.4,0,.2,1) 0.95s forwards;
    }
    @keyframes dotGlow {
      from { box-shadow: 0 0 14px 4px rgba(255,119,0,.45), 0 0 40px 12px rgba(255,119,0,.15); }
      to   { box-shadow: 0 0 28px 10px rgba(255,119,0,.75), 0 0 70px 24px rgba(255,119,0,.3); }
    }
    @keyframes dotRoll {
      0%   { left: 0;                     box-shadow: 0 0 20px 6px rgba(255,119,0,.6); }
      80%  { left: var(--roll-end, 80%);  box-shadow: 0 0 20px 6px rgba(255,119,0,.6); }
      100% { left: var(--dot-final, 72%); box-shadow: 0 0 28px 9px rgba(255,119,0,.8), 0 0 70px 26px rgba(255,119,0,.35); }
    }

    /* Exit fade overlay */
    #exit-overlay {
      position: fixed;
      inset: 0;
      background: #111827;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.65s ease;
    }
    #exit-overlay.active { opacity: 1; }

    /* Ambient floating particles */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,119,0,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: rise linear infinite;
    }
    @keyframes rise {
      from { transform: translateY(0) scale(1);   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      to   { transform: translateY(-110vh) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>

<div id="splash">
  <div class="logo-word" id="logoWord">
    <span class="letter">h</span>
    <span class="letter">u</span>
    <span class="letter">d</span>
    <span class="letter">d</span>
    <span class="letter">l</span>
    <span class="letter">e</span>
    <span class="dot" id="dot"></span>
  </div>
</div>

<div id="exit-overlay"></div>

<script>
(function () {
  /* Calibrate dot roll distance based on actual letter widths */
  function calibrate() {
    var word    = document.getElementById('logoWord');
    var dot     = document.getElementById('dot');
    var letters = word.querySelectorAll('.letter');
    if (!letters.length || !dot.offsetWidth) return;

    var totalW  = word.getBoundingClientRect().width;
    var wr      = word.getBoundingClientRect();
    var r4      = letters[3].getBoundingClientRect(); // 4th letter 'd'
    var endPx   = r4.right  - wr.left;
    var finalPx = endPx + dot.offsetWidth * 0.3;

    word.style.setProperty('--roll-end',   Math.round((endPx  + dot.offsetWidth) / totalW * 100) + '%');
    word.style.setProperty('--dot-final',  Math.round(finalPx / totalW * 100) + '%');
  }
  requestAnimationFrame(calibrate);

  /* Ambient particles */
  for (var i = 0; i < 10; i++) {
    var p  = document.createElement('div');
    p.className = 'particle';
    var sz = Math.random() * 180 + 50;
    p.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (Math.random() * 100) + 'vw;bottom:-' + sz + 'px;animation-duration:' + (Math.random() * 14 + 8).toFixed(1) + 's;animation-delay:' + (Math.random() * 6).toFixed(1) + 's;';
    document.body.appendChild(p);
  }

  /* Fade out + redirect after animation completes (~3.5s total) */
  var overlay = document.getElementById('exit-overlay');
  setTimeout(function () {
    overlay.classList.add('active');
    setTimeout(function () { window.location.href = 'index.html'; }, 700);
  }, 3500);
})();
</script>
</body>
</html>
