<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Huddle</title>
  <meta name="description" content="Sign in to your Huddle workspace. Real-time collaboration, channels, and team messaging.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
</head>
<body>

  <div class="page-wrapper">
    <!-- Left Column: Form Section -->
    <div class="auth-left-pane">
      <!-- Top Brand Header -->
      <header class="auth-header">
        <a href="signup.html" class="brand-logo" aria-label="Huddle Home">
          huddle<span class="dot">•</span>
        </a>
        <div class="locale-indicator" role="button" tabindex="0" title="Language selection">
          ENG US
        </div>
      </header>

      <!-- Main Form Area -->
      <main class="auth-content">
        <h1 class="auth-heading">Welcome back!</h1>
        <p class="auth-subheading">Sign in to your Huddle workspace.</p>

        <form id="signinForm" class="auth-form" novalidate>
          <!-- Email Field -->
          <div class="form-group">
            <label for="email" class="form-label">
              Email <span class="asterisk">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
              </span>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="james@example.com" 
                required 
                autofocus 
                autocomplete="email"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password" class="form-label">
              Password <span class="asterisk">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="••••••••••••" 
                required 
                autocomplete="current-password"
              >
              <button 
                type="button" 
                class="input-icon-right" 
                data-toggle="password" 
                data-target="password" 
                aria-label="Toggle password visibility"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Forgot Password Link -->
          <a href="#" class="forgot-password-link" id="forgotPasswordLink">Forgot password?</a>

          <!-- Submit Button -->
          <div class="form-actions">
            <button type="submit" class="submit-btn" disabled id="signinBtn">
              <span class="btn-spinner" aria-label="Loading..."></span>
              <span class="btn-text">Continue</span>
            </button>
          </div>

          <!-- Don't have an account link -->
          <p class="auth-switch-text">
            Don't have an account? <a href="signup.html">Sign up</a>
          </p>
        </form>
      </main>

      <!-- Desktop Footer -->
      <footer class="auth-footer">
        2026. Huddle by Altschool Africa
      </footer>
    </div>

    <!-- Right Column: Hero Image Card (Desktop Only) -->
    <aside class="auth-right-pane" aria-label="Team preview">
      <div class="hero-image-card">
        <img 
          src="images/side-image.jpg" 
          alt="Two team members collaborating happily on a laptop in an office lounge"
          loading="eager"
        >
      </div>
    </aside>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
